<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letture</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      color: #333;
      padding: 24px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #3ab4d0;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Search bar */
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      max-width: 480px;
    }

    .search-bar input {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s;
    }
    .search-bar input:focus { border-color: #3ab4d0; }

    .btn {
      padding: 9px 20px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary  { background: #3ab4d0; color: #fff; }
    .btn-danger   { background: #e03535; color: #fff; }
    .btn-sm       { padding: 5px 12px; font-size: 0.8rem; }

    /* Card */
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,.08);
      overflow: hidden;
      margin-bottom: 16px;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    thead th {
      color: #3ab4d0;
      font-weight: 600;
      padding: 12px 14px;
      text-align: center;
      border-bottom: 2px solid #e8f7fb;
      white-space: nowrap;
    }

    tbody tr:hover { background: #f7fbfd; }

    tbody td {
      padding: 10px 14px;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
    }

    tbody tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-yes { background: #d4edda; color: #155724; }
    .badge-no  { background: #f8d7da; color: #721c24; }

    /* Footer count */
    .table-footer {
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #666;
      border-top: 1px solid #f0f0f0;
    }

    /* Delete all btn */
    .actions-bar {
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }

    /* States */
    .state-msg {
      text-align: center;
      padding: 40px;
      color: #888;
      font-size: 0.95rem;
    }

    .error-msg {
      background: #fff3f3;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 14px 18px;
      color: #721c24;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    #spinner { display: none; }
    #spinner.active { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-icon {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid #ccc;
      border-top-color: #3ab4d0;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <h1>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3ab4d0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    Letture
  </h1>

  <div class="search-bar">
    <input id="varcoInput" type="text" placeholder="ID o UUID varco…" autofocus>
    <button class="btn btn-primary" onclick="doSearch()">Cerca</button>
    <span id="spinner"><span class="spinner-icon"></span></span>
  </div>

  <div id="errorBox" class="error-msg" style="display:none"></div>

  <div id="resultArea" style="display:none">
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Lancio</th>
            <th>Parte capo</th>
            <th>Articolo</th>
            <th>Variante</th>
            <th>Taglia</th>
            <th>Quantità</th>
            <th>Data ora</th>
            <th>Processed</th>
            <th>Cancel</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="table-footer" id="footerCount"></div>
    </div>

    <div class="actions-bar">
      <button class="btn btn-danger" onclick="deleteAll()">&#128465; ELIMINA TUTTE LE LETTURE</button>
    </div>
  </div>

  <div id="emptyMsg" class="state-msg" style="display:none">Nessun risultato.</div>

<script>
  let currentVarco = '';

  function setLoading(on) {
    document.getElementById('spinner').className = on ? 'active' : '';
    document.querySelectorAll('.btn').forEach(b => b.disabled = on);
  }

  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.style.display = 'block';
  }

  function clearError() {
    document.getElementById('errorBox').style.display = 'none';
  }

  function badge(val) {
    const yes = val === 1 || val === '1' || val === true;
    return `<span class="badge ${yes ? 'badge-yes' : 'badge-no'}">${yes ? 'Sì' : 'No'}</span>`;
  }

  function formatDate(val) {
    if (!val) return '—';
    return val.replace('T', ' ').substring(0, 19);
  }

  function renderRows(rows) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.Lancio ?? '—'}</td>
        <td>${r.ParteCapo ?? '—'}</td>
        <td>${r.Articolo ?? '—'}</td>
        <td>${r.DexVariante ?? r.Variante ?? '—'}</td>
        <td>${r.Taglia ?? '—'}</td>
        <td>${r.Quantita ?? '—'}</td>
        <td>${formatDate(r.Orario_Lettura)}</td>
        <td>${badge(r.processed)}</td>
        <td>${badge(r.cancel)}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteRow(${r.id}, this)">&#128465; Elimina</button></td>
      `;
      tbody.appendChild(tr);
    });
    const n = rows.length;
    document.getElementById('footerCount').textContent =
      n > 0 ? `Vista da 1 a ${n} di ${n} elementi` : '';
  }

  async function doSearch() {
    const varco = document.getElementById('varcoInput').value.trim();
    if (!varco) return;
    currentVarco = varco;
    clearError();
    setLoading(true);

    try {
      const res = await fetch(`/api/letture?varco=${encodeURIComponent(varco)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Errore server');

      if (data.total === 0) {
        document.getElementById('resultArea').style.display = 'none';
        document.getElementById('emptyMsg').style.display = 'block';
      } else {
        document.getElementById('emptyMsg').style.display = 'none';
        document.getElementById('resultArea').style.display = 'block';
        renderRows(data.rows);
      }
    } catch (e) {
      showError(e.message);
    } finally {
      setLoading(false);
    }
  }

  async function deleteRow(id, btn) {
    if (!confirm('Eliminare questa lettura?')) return;
    btn.disabled = true;
    try {
      const res = await fetch(`/api/letture/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.detail || 'Errore cancellazione');
      }
      btn.closest('tr').remove();
      // aggiorna contatore
      const rows = document.querySelectorAll('#tableBody tr').length;
      document.getElementById('footerCount').textContent =
        rows > 0 ? `Vista da 1 a ${rows} di ${rows} elementi` : '';
      if (rows === 0) {
        document.getElementById('resultArea').style.display = 'none';
        document.getElementById('emptyMsg').style.display = 'block';
      }
    } catch (e) {
      alert(e.message);
      btn.disabled = false;
    }
  }

  async function deleteAll() {
    if (!currentVarco) return;
    if (!confirm('Eliminare TUTTE le letture per questo varco?')) return;
    setLoading(true);
    clearError();
    try {
      const res = await fetch(`/api/letture?varco=${encodeURIComponent(currentVarco)}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Errore cancellazione');
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('emptyMsg').style.display = 'block';
      document.getElementById('emptyMsg').textContent =
        `Eliminate ${data.deleted} letture.`;
    } catch (e) {
      showError(e.message);
    } finally {
      setLoading(false);
    }
  }

  // Cerca premendo Invio
  document.getElementById('varcoInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });
</script>
</body>
</html>
