<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TreePage{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

  <nav class="topbar">
    <a class="topbar__brand" href="/dashboard/">
      <span class="topbar__logo">🌳</span>
      <span class="topbar__name">TreePage</span>
    </a>
    <div class="topbar__actions">
      {% block topbar_actions %}{% endblock %}
      <a class="topbar__link" href="/dashboard/" title="Dashboards">&#127968;</a>
      <a class="topbar__link" href="/admin/" title="Admin">&#9881;&#65039;</a>
      <a class="topbar__link" href="/api/docs" title="API docs" target="_blank">&#128196;</a>
    </div>
  </nav>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
