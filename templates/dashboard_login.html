{% extends "base.html" %}

{% block title %}Accesso – {{ user.name }}{% endblock %}
{% block body_class %}login-page{% endblock %}

{% block content %}
<div class="login-wrap">
  {% if error %}
  <div class="flash flash--error">Password non corretta. Riprova.</div>
  {% endif %}

  <div class="login-card">
    <div class="login-card__header">
      <span class="login-card__logo">{{ user.icon }}</span>
      <h1 class="login-card__title">{{ user.name }}</h1>
      <p style="font-size:.85rem;color:var(--text-muted);text-align:center">Questa dashboard è protetta da password.</p>
    </div>

    <form class="login-form" method="post" action="/dashboard/{{ user.slug }}/login">
      <label>Password
        <input class="input" type="password" name="password" autofocus required autocomplete="current-password" />
      </label>
      <button class="btn btn--primary" type="submit">Accedi</button>
    </form>
  </div>
</div>
{% endblock %}
