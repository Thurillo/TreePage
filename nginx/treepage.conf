# =========================================================
# TreePage – Nginx configuration
#
# Installa in: /etc/nginx/sites-available/treepage
# Attiva con:  ln -s /etc/nginx/sites-available/treepage /etc/nginx/sites-enabled/
# Test:        nginx -t
# Ricarica:    systemctl reload nginx
# =========================================================

upstream treepage_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;   # Sostituisci con il tuo hostname/IP se necessario

    # Charset e logging
    charset utf-8;
    access_log /var/log/nginx/treepage_access.log;
    error_log  /var/log/nginx/treepage_error.log;

    # ── Hosted HTML projects: serviti direttamente da Nginx ──────────
    location /projects/ {
        alias /opt/treepage/projects/;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;

        # Cache assets statici
        location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Static assets di TreePage ─────────────────────────────────────
    location /static/ {
        alias /opt/treepage/static/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ── Tutto il resto va a FastAPI ───────────────────────────────────
    location / {
        proxy_pass         http://treepage_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # ── API proxy verso i microservizi Python ─────────────────────────
    # Il routing /api/scripts/{name}/* è gestito internamente da FastAPI
    # che fa da proxy verso le porte dei microservizi. Nessuna regola
    # Nginx aggiuntiva necessaria per questo.

    # ── Sicurezza di base ─────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy        "strict-origin-when-cross-origin";

    # Nascondi versione Nginx
    server_tokens off;

    # Limita dimensione upload (utile se in futuro si aggiunge upload file)
    client_max_body_size 50M;
}
